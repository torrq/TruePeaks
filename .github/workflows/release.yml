name: Release Builds

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x86_64)
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            cache_key: windows-x86_64
            artifact_name: truepeaks-windows-x86_64
          - name: Linux (x86_64)
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            cache_key: linux-x86_64
            artifact_name: truepeaks-linux-x86_64
          - name: macOS (Universal arm64 + x86_64)
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            cache_key: macos-universal
            artifact_name: truepeaks-macos-universal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux windowing/GL dev libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache_key }}

      - name: Run release tests (native host target)
        run: cargo test --release --locked

      - name: Build release binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/truepeaks.exe dist/stage/
          Copy-Item README.md, LICENSE dist/stage/
          Compress-Archive -Path dist/stage/* -DestinationPath dist/truepeaks-windows-x86_64.zip -Force

      - name: Build release binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          strip target/x86_64-unknown-linux-gnu/release/truepeaks
          mkdir -p dist/stage
          cp target/x86_64-unknown-linux-gnu/release/truepeaks dist/stage/
          cp README.md LICENSE dist/stage/
          tar -czf dist/truepeaks-linux-x86_64.tar.gz -C dist/stage .

      - name: Build Universal macOS .app bundle (arm64 + x86_64)
        if: matrix.os == 'macos-latest'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist/stage/TruePeaks.app/Contents/MacOS
          lipo -create \
            target/aarch64-apple-darwin/release/truepeaks \
            target/x86_64-apple-darwin/release/truepeaks \
            -output dist/stage/TruePeaks.app/Contents/MacOS/truepeaks
          chmod +x dist/stage/TruePeaks.app/Contents/MacOS/truepeaks
          cat << 'EOF' > dist/stage/TruePeaks.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>truepeaks</string>
            <key>CFBundleIdentifier</key>
            <string>org.truepeaks.TruePeaks</string>
            <key>CFBundleName</key>
            <string>TruePeaks</string>
            <key>CFBundleDisplayName</key>
            <string>TruePeaks</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          cp README.md LICENSE dist/stage/
          ditto -c -k --sequesterRsrc dist/stage dist/truepeaks-macos-universal.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
