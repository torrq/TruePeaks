[package]
name = "truepeaks"
version = "0.1.2"
edition = "2021"
description = "High-performance pure-Rust audio loudness and PMF dynamic range analyzer"
license = "MIT"
repository = "https://github.com/torrq/TruePeaks"

[dependencies]
eframe = "0.29"
egui = "0.29"
rfd = "0.15"
rayon = "1.10"
crossbeam-channel = "0.5"
symphonia = { version = "0.5.4", features = ["all"] }
ebur128 = "0.1.10"
unicode-normalization = "0.1"
unicode-width = "0.2"
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"
chrono = "0.4"
