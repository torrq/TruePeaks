[package]
name = "truepeaks"
version = "0.1.7"
edition = "2021"
description = "High-performance pure-Rust audio loudness and PMF dynamic range analyzer"
license = "MIT"
repository = "https://github.com/torrq/TruePeaks"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:resvg", "dep:rfd"]

[[bin]]
name = "truepeaks"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "truepeaks-cli"
path = "src/bin/truepeaks_cli.rs"

[dependencies]
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }
resvg = { version = "0.45", default-features = false, optional = true }
rfd = { version = "0.15", optional = true }
rayon = "1.10"
crossbeam-channel = "0.5"
symphonia = { version = "0.5.4", features = ["all"] }
ebur128 = "0.1.10"
unicode-normalization = "0.1"
unicode-width = "0.2"
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"
chrono = "0.4"
